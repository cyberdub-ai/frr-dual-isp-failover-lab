frr version 10.2.1
frr defaults traditional
hostname edge-gw
log stdout informational
service integrated-vtysh-config
!
! Deterministic Null0 aggregate anchors (prevents BGP route flapping)
ip route 198.51.100.0/24 Null0
ipv6 route 2001:db8:6501::/48 Null0
!
! Strict outbound prefix-lists (Anti-Transit Guard)
ip prefix-list OWN-PREFIXES-OUT seq 10 permit 198.51.100.0/24
ip prefix-list OWN-PREFIXES-OUT seq 100 deny any
!
ipv6 prefix-list OWN-V6-OUT seq 10 permit 2001:db8:6501::/48
ipv6 prefix-list OWN-V6-OUT seq 100 deny any
!
! Inbound default/lab-target filter (reject RFC1918 & own space)
ip prefix-list ISP-IN-V4 seq 5 deny 198.51.100.0/24 le 32
ip prefix-list ISP-IN-V4 seq 10 deny 10.0.0.0/8 le 32
ip prefix-list ISP-IN-V4 seq 20 deny 172.16.0.0/12 le 32
ip prefix-list ISP-IN-V4 seq 30 deny 192.168.0.0/16 le 32
ip prefix-list ISP-IN-V4 seq 50 permit 0.0.0.0/0
ip prefix-list ISP-IN-V4 seq 60 permit 203.0.113.0/24 le 24
ip prefix-list ISP-IN-V4 seq 100 deny any
!
! Sub-second BFD profile: 300ms x 3 = 900ms failure detection
bfd
 profile ISP-FAST
  detect-multiplier 3
  transmit-interval 300
  receive-interval 300
 !
!
! Route-maps: Primary ISP1 (LP 200, clean AS-path) vs Backup ISP2 (LP 100, prepend 2x)
route-map ISP1-IN permit 10
 match ip address prefix-list ISP-IN-V4
 set local-preference 200
!
route-map ISP1-OUT permit 10
 match ip address prefix-list OWN-PREFIXES-OUT
!
route-map ISP2-IN permit 10
 match ip address prefix-list ISP-IN-V4
 set local-preference 100
!
route-map ISP2-OUT permit 10
 match ip address prefix-list OWN-PREFIXES-OUT
 set as-path prepend 65010 65010
!
router bgp 65010
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 10 30
 !
 ! Primary Uplink — ISP1 (AS 65100)
 neighbor 10.255.1.2 remote-as 65100
 neighbor 10.255.1.2 description ISP1-PRIMARY
 neighbor 10.255.1.2 bfd profile ISP-FAST
 !
 ! Backup Uplink — ISP2 (AS 65200)
 neighbor 10.255.2.2 remote-as 65200
 neighbor 10.255.2.2 description ISP2-BACKUP
 neighbor 10.255.2.2 bfd profile ISP-FAST
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.255.1.2 activate
  neighbor 10.255.1.2 soft-reconfiguration inbound
  neighbor 10.255.1.2 maximum-prefix 1000 80 restart 5
  neighbor 10.255.1.2 route-map ISP1-IN in
  neighbor 10.255.1.2 route-map ISP1-OUT out
  neighbor 10.255.2.2 activate
  neighbor 10.255.2.2 soft-reconfiguration inbound
  neighbor 10.255.2.2 maximum-prefix 1000 80 restart 5
  neighbor 10.255.2.2 route-map ISP2-IN in
  neighbor 10.255.2.2 route-map ISP2-OUT out
 exit-address-family
!
line vty
!
