frr version 10.2.1
frr defaults traditional
hostname isp1-primary
log stdout informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 Null0
ip route 203.0.113.0/24 Null0
!
ip prefix-list CUST-65010-IN seq 10 permit 198.51.100.0/24
ip prefix-list CUST-65010-IN seq 100 deny any
!
ip prefix-list TO-CUST-OUT seq 10 permit 0.0.0.0/0
ip prefix-list TO-CUST-OUT seq 20 permit 203.0.113.0/24
ip prefix-list TO-CUST-OUT seq 100 deny any
!
bfd
 profile ISP-FAST
  detect-multiplier 3
  transmit-interval 300
  receive-interval 300
 !
!
route-map FROM-EDGE permit 10
 match ip address prefix-list CUST-65010-IN
!
route-map TO-EDGE permit 10
 match ip address prefix-list TO-CUST-OUT
!
router bgp 65100
 bgp router-id 10.255.1.2
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.255.1.1 remote-as 65010
 neighbor 10.255.1.1 bfd profile ISP-FAST
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 203.0.113.0/24
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 route-map FROM-EDGE in
  neighbor 10.255.1.1 route-map TO-EDGE out
 exit-address-family
!
line vty
!
