[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frr-dual-isp-failover-lab"
version = "0.1.0"
description = "Reproducible FRRouting Dual-ISP BGP+BFD sub-second failover lab and zero-dependency policy auditor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Alexey Zhuykov", email = "alexey.zhuykov@gmail.com" }]
keywords = ["bgp", "bfd", "frrouting", "linux-networking", "sre", "telecom", "failover", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

[project.scripts]
frr-failover-audit = "frr_failover_audit.__main__:main"

[project.urls]
Homepage = "https://github.com/cyberdub-ai/frr-dual-isp-failover-lab"
Repository = "https://github.com/cyberdub-ai/frr-dual-isp-failover-lab"
Author = "https://cyberdub.su"
